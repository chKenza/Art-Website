        <section class="series">
            <header class="series-header">
                <h2>Echoes of the Mind</h2>
            </header>
        <div class="gallery">
            <button class="art" type="button" style="--ar: 0.765"
                    data-title="Overthinking"
                    data-technique="Ink on paper, A4"
                    data-full="images/drawings/large/overthinking.webp"
                    data-description="This ink drawing illustrates the torment of overthinking, a person haunted by their own inner demons, each one a manifestation of thought turned hostile. These figures erupt from the figure’s own hand, a violent projection of the mind against itself. Fragmented, hollow, and afraid, the figure is left dismembered by their own creation, a victim of the very thoughts they cannot escape.">
                <span class="art-frame"><img src="images/drawings/thumbs/overthinking.webp" alt="Overthinking" width="720" height="941" loading="eager" decoding="async"></span>
                <span class="art-title">Overthinking</span>
            </button>
            <button class="art" type="button" style="--ar: 0.750"
                    data-title="Drowning"
                    data-technique="Pencil on paper, A4"
                    data-full="images/drawings/large/drowning.webp"
                    data-description="Everything seems so clear, until it takes a blurry shape. The sea dissolves into a grey-toned sky, and with it, your sense of self fades. You fall into a world where nothing is distinct, not even your own reflection. You’re held, anchored, perhaps, but even in that embrace, you’re drowning. This piece explores the quiet collapse of identity, the disorientation of emotional overwhelm, and the unsettling truth that sometimes, we vanish even while being held.">
                <span class="art-frame"><img src="images/drawings/thumbs/drowning.webp" alt="Drowning" width="240" height="320" loading="eager" decoding="async"></span>
                <span class="art-title">Drowning</span>
            </button>
            <button class="art" type="button" style="--ar: 0.750"
                    data-title="Spleen"
                    data-technique="Oil pastel on paper, A4"
                    data-full="images/drawings/large/spleen.webp"
                    data-description="Having wings, yet remaining still. Holding a balloon, a symbol of joy, yet refusing to look at it. Surrounded by a storm, yet making no attempt to escape. This drawing evokes spleen, as described by Baudelaire, a paralyzing melancholy born from the sheer weight of existing. It captures the quiet contradiction of despair, when hope is within reach, but the will to grasp it is gone.">
                <span class="art-frame"><img src="images/drawings/thumbs/spleen.webp" alt="Spleen" width="240" height="320" loading="eager" decoding="async"></span>
                <span class="art-title">Spleen</span>
            </button>
            <button class="art" type="button" style="--ar: 0.750"
                    data-title="Incomplete"
                    data-technique="Pencil on paper"
                    data-full="images/drawings/large/incomplete.webp"
                    data-description="The drawing captures the ache of closeness that doesn’t quite heal the absence. The embrace is full, yet one figure fades, a reminder that even in connection, something can still feel missing. This piece reflects the human urge to seek completion in another, when in truth, the void we carry can only be filled from within.">
                <span class="art-frame"><img src="images/drawings/thumbs/incomplete.webp" alt="Incomplete" width="240" height="320" loading="eager" decoding="async"></span>
                <span class="art-title">Incomplete</span>
            </button>
            <button class="art" type="button" style="--ar: 0.750"
                    data-title="Hot Mess"
                    data-technique="Pencil on paper"
                    data-full="images/drawings/large/hot_mess.webp"
                    data-description="This drawing is a raw reflection of internal chaos, a moment where the mind feels tangled, heavy, and loud. The rough lines and shadowed figure capture a state of emotional overwhelm, where clarity slips away and all that&#x27;s left is the weight of thought.">
                <span class="art-frame"><img src="images/drawings/thumbs/hot_mess.webp" alt="Hot Mess" width="240" height="320" loading="lazy" decoding="async"></span>
                <span class="art-title">Hot Mess</span>
            </button>
            <button class="art" type="button" style="--ar: 0.818"
                    data-title="Heart of Feather"
                    data-technique="Pencil on paper"
                    data-full="images/drawings/large/heart_of_feather.webp"
                    data-description="This piece draws inspiration from ancient Egyptian symbolism, the scale, the feather of Ma’at, and the human heart. At the center, the all-seeing eye hovers above the balance, invoking divine perception and truth. The heart and feather rest in opposing trays, echoing the mythic trial of the soul, where one’s essence is weighed not against deeds, but against the purity of truth. It explores the tension between morality, emotion, and cosmic order, a silent reckoning between who we are and who we claim to be.">
                <span class="art-frame"><img src="images/drawings/thumbs/heart_of_feather.webp" alt="Heart of Feather" width="720" height="880" loading="lazy" decoding="async"></span>
                <span class="art-title">Heart of Feather</span>
            </button>
            <button class="art" type="button" style="--ar: 0.688"
                    data-title="Alone in the Crowd"
                    data-technique="Oil pastel on cardboard"
                    data-full="images/drawings/large/alone_in_the_crowd.webp"
                    data-description="Drawn on a cardboard box covered in receipts collected from different stores, purchases, and moments, this piece is a critique of capitalism and overconsumption. It depicts loneliness within that framework: always surrounded by people, in the streets, on public transport, or elsewhere, people still remain lonely, alone in a crowd, surrounded by people.">
                <span class="art-frame"><img src="images/drawings/thumbs/alone_in_the_crowd.webp" alt="Alone in the Crowd" width="720" height="1047" loading="lazy" decoding="async"></span>
                <span class="art-title">Alone in the Crowd</span>
            </button>
        </div>
        </section>

        <section class="series">
            <header class="series-header">
                <h2>Ethereal Lines</h2>
            </header>
        <div class="gallery">
            <button class="art" type="button" style="--ar: 0.750"
                    data-title="Path of Stillness"
                    data-technique="Pencil on paper"
                    data-full="images/drawings/large/path_of_stillness.webp"
                    data-description="This piece draws from Japanese aesthetics, where minimalism meets symbolism. A winding line flows like a river, gently wrapping around a bonsai-like tree. The red sun anchors the scene in tradition, while architectural forms create balance between nature and structure. Through soft gradients and curving forms, this drawing captures a meditative sense of movement, a stillness that drifts, like breath, within ethereal lines.">
                <span class="art-frame"><img src="images/drawings/thumbs/path_of_stillness.webp" alt="Path of Stillness" width="720" height="960" loading="lazy" decoding="async"></span>
                <span class="art-title">Path of Stillness</span>
            </button>
            <button class="art" type="button" style="--ar: 1.047"
                    data-title="Insecta"
                    data-technique="Pencil on paper"
                    data-full="images/drawings/large/insecta.webp"
                    data-description="This drawing challenges the conventions of beauty by merging the forms of a butterfly and a spider, two creatures from the same world, yet judged through opposing lenses. The delicate symmetry and wing-like structures evoke elegance, while the central body hints at something unsettling, even arachnid. By blending grace with discomfort, the piece exposes our double standards: how instinct and perception distort what we deem beautiful or repellent. It invites the viewer to question why we fear one and adore the other, when both are simply nature’s design.">
                <span class="art-frame"><img src="images/drawings/thumbs/insecta.webp" alt="Insecta" width="754" height="720" loading="lazy" decoding="async"></span>
                <span class="art-title">Insecta</span>
            </button>
            <button class="art" type="button" style="--ar: 0.776"
                    data-title="Flying :)"
                    data-technique="Pencil on paper"
                    data-full="images/drawings/large/flyin.webp"
                    data-description="Inspired by the cover of Flying :) by Tom Odell, this drawing captures the fragile stillness between longing and escape. The figure sits grounded, almost fading into the silence of blue surroundings, yet their shadow stretches behind them, not as a weight, but as wings. It suggests that flight isn’t always motion; sometimes, it’s a quiet ache, a memory of freedom, or a hope not yet realized. The image speaks softly of restraint and the invisible pull of dreams that never quite lift us off the ground.">
                <span class="art-frame"><img src="images/drawings/thumbs/flyin.webp" alt="Flying :)" width="720" height="928" loading="lazy" decoding="async"></span>
                <span class="art-title">Flying :)</span>
            </button>
            <button class="art" type="button" style="--ar: 0.715"
                    data-title="Gravity Between Us"
                    data-technique="Pencil on paper"
                    data-full="images/drawings/large/gravity_between_us.webp"
                    data-description="Two hands drift toward each other through warped space, their forms stretching and folding like time and memory. Their connection is suspended in a cosmic pull, not yet a touch, but an undeniable force drawing them together.">
                <span class="art-frame"><img src="images/drawings/thumbs/gravity_between_us.webp" alt="Gravity Between Us" width="720" height="1007" loading="lazy" decoding="async"></span>
                <span class="art-title">Gravity Between Us</span>
            </button>
            <button class="art" type="button" style="--ar: 1.508"
                    data-title="Where Light Once Fell"
                    data-technique="Oil paster on paper"
                    data-full="images/drawings/large/where_light_once_fell.webp"
                    data-description="This piece captures a soft, dreamy moment in nature. The warm tones, blurred edges, and flowing dress create a sense of quiet beauty and lightness. Surrounded by greenery and dappled light, the figures blend into a peaceful, almost timeless atmosphere, like a memory you can’t quite place, but still want to return to.">
                <span class="art-frame"><img src="images/drawings/thumbs/where_light_once_fell.webp" alt="Where Light Once Fell" width="1086" height="720" loading="lazy" decoding="async"></span>
                <span class="art-title">Where Light Once Fell</span>
            </button>
            <button class="art" type="button" style="--ar: 0.750"
                    data-title="Flight or Fall"
                    data-technique="Watercolor on paper"
                    data-full="images/drawings/large/flight_or_fall.webp"
                    data-description="This butterfly, rich in deep shades of blue and green, seems to unravel as it flies, its wings melting into delicate streams of color. The paint drips, blurring the lines between flight and fall. There’s a quiet elegance in its motion, a sense of fragility suspended in time, as if even the most graceful forms can carry the weight of something unspoken.">
                <span class="art-frame"><img src="images/drawings/thumbs/flight_or_fall.webp" alt="Flight or Fall" width="720" height="960" loading="lazy" decoding="async"></span>
                <span class="art-title">Flight or Fall</span>
            </button>
            <button class="art" type="button" style="--ar: 0.745"
                    data-title="Threaded Branches"
                    data-technique="Pencil on paper"
                    data-full="images/drawings/large/threaded_branches.webp"
                    data-description="What begins as scattered scribbles and intersecting lines slowly unfolds into a tree branch, delicate and surreal. It twists and grows, holding small buds and falling leaves. This piece celebrates the quiet beauty of unplanned form , how chaos can curve into nature, and how meaning can emerge from nothing more than a line.">
                <span class="art-frame"><img src="images/drawings/thumbs/threaded_branches.webp" alt="Threaded Branches" width="720" height="967" loading="lazy" decoding="async"></span>
                <span class="art-title">Threaded Branches</span>
            </button>
            <button class="art" type="button" style="--ar: 0.750"
                    data-title="Just Keep Swimming"
                    data-technique="Pencil on paper"
                    data-full="images/drawings/large/just_keep_swimming.webp"
                    data-description="Inspired by Dory’s phrase from Finding Nemo (2003), this drawing is a quiet tribute to persistence. Two fish swim in soft, ethereal lines, their forms carried by waves that echo both calm and chaos. Life’s current isn’t always gentle, but this piece reminds us to keep moving, keep flowing, even when the path ahead is unclear. There is grace in endurance, and beauty in every stroke forward.">
                <span class="art-frame"><img src="images/drawings/thumbs/just_keep_swimming.webp" alt="Just Keep Swimming" width="720" height="960" loading="lazy" decoding="async"></span>
                <span class="art-title">Just Keep Swimming</span>
            </button>
            <button class="art" type="button" style="--ar: 1.478"
                    data-title="She Turned Toward the Light"
                    data-technique="Oil pastel on paper"
                    data-full="images/drawings/large/she_turned_toward_the_light.webp"
                    data-description="This portrait glows with contrast, darkness meeting light in bold, expressive strokes. The figure gazes back, poised between shadow and illumination, her presence both strong and tender. Around her, the world blurs into color and movement, as if the moment itself is shifting. It’s a fleeting glimpse of someone caught mid-thought, mid-turn, facing the unknown, but not afraid of it.">
                <span class="art-frame"><img src="images/drawings/thumbs/she_turned_toward_the_light.webp" alt="She Turned Toward the Light" width="1064" height="720" loading="lazy" decoding="async"></span>
                <span class="art-title">She Turned Toward the Light</span>
            </button>
        </div>

            </header>
        <div class="gallery">
            <button class="art" type="button" style="--ar: 0.963"
                    data-title="What We Hold"
                    data-technique="Soft pastel on paper"
                    data-full="images/drawings/large/what_we_hold.webp"
                    data-description="The eye becomes a universe of its own, detailed, reflective, alive. Look closely, and you&#x27;ll find petals blooming in the iris, as if nature and perception are one. The sunflower-like form suggests warmth in the gaze. This piece invites viewers to consider not just what we see, but the beauty we carry within.">
                <span class="art-frame"><img src="images/drawings/thumbs/what_we_hold.webp" alt="What We Hold" width="308" height="320" loading="lazy" decoding="async"></span>
                <span class="art-title">What We Hold</span>
            </button>
            <button class="art" type="button" style="--ar: 1.285"
                    data-title="Flying"
                    data-technique="Pencil on paper, A5"
                    data-full="images/drawings/large/flying_birds.webp"
                    data-description="Eyes and birds, both witness chaos, and yet they soar. Through life’s unpredictable winds, they drift, torn and tested, chasing fragments of beauty scattered across the universe. The storms carve invisible trails, like the delicate lines of a cornea, binding the disarray into something whole. Fragile, yet determined, they rise from the turbulence, they fly.">
                <span class="art-frame"><img src="images/drawings/thumbs/flying_birds.webp" alt="Flying" width="320" height="249" loading="lazy" decoding="async"></span>
                <span class="art-title">Flying</span>
            </button>
            <button class="art" type="button" style="--ar: 1.135"
                    data-title="Fractured Vision"
                    data-technique="Pencil on paper"
                    data-full="images/drawings/large/fractured_vision.webp"
                    data-description="This eye stares out from a world that&#x27;s breaking apart, its edges cracked, its lashes tangled with branches and flight. In the iris, a splash of vivid blue, a bird mid-motion, and a sense of something deeper trying to escape. This drawing reflects how fragile sight can be when shaped by pain, and how even under pressure, beauty still fights to emerge.">
                <span class="art-frame"><img src="images/drawings/thumbs/fractured_vision.webp" alt="Fractured Vision" width="320" height="282" loading="lazy" decoding="async"></span>
