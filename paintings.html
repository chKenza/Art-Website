        <section class="series">
            <header class="series-header">
                <h2>Veins of leaves</h2>
            </header>
        <div class="gallery">
            <button class="art" type="button" style="--ar: 0.756"
                    data-title="Drift"
                    data-technique="Oil on Canvas, 30x40 cm"
                    data-full="images/paintings/large/drift.webp"
                    data-description="Suspended in an underwater current, the human form moves with the grace of the jellyfish around her.This painting reflects on our shared rhythm with nature, where every pulse, breath, and movement echoes something older, deeper, and beautifully wild.">
                <span class="art-frame"><img src="images/paintings/thumbs/drift.webp" alt="Drift" width="720" height="952" loading="eager" decoding="async"></span>
                <span class="art-title">Drift</span>
            </button>
            <button class="art" type="button" style="--ar: 1.506"
                    data-title="Fractals"
                    data-technique="Oil on Canvas, 20x30 cm"
                    data-full="images/paintings/large/fractals.webp"
                    data-description="Unpredictable, strong, yet beautiful, waves, like eyes, hold mystery. In this painting, the iris becomes ocean, the pupil a storm. Calm lines spiral into crashing force, revealing how humans mirror nature: chaotic, layered, and impossible to fully grasp. A visual reflection of inner turbulence and raw emotional tide.">
                <span class="art-frame"><img src="images/paintings/thumbs/fractals.webp" alt="Fractals" width="1084" height="720" loading="eager" decoding="async"></span>
                <span class="art-title">Fractals</span>
            </button>
            <button class="art" type="button" style="--ar: 0.726"
                    data-title="Becoming"
                    data-technique="Oil on Canvas, 30x40 cm"
                    data-full="images/paintings/large/becoming.webp"
                    data-description="In this painting, the boundary between woman and nature dissolves. Butterflies weave into her hair, becoming part of her, or perhaps she, part of them. This piece explores the quiet harmony between our bodies and the earth, where transformation is not an event, but a state of being.">
                <span class="art-frame"><img src="images/paintings/thumbs/becoming.webp" alt="Becoming" width="720" height="992" loading="eager" decoding="async"></span>
                <span class="art-title">Becoming</span>
            </button>
            <button class="art" type="button" style="--ar: 0.735"
                    data-title="Tide Within"
                    data-technique="Oil on Canvas, 30x40 cm"
                    data-full="images/paintings/large/tide_within.webp"
                    data-description="A crashing wave overtakes half her face, swallowing her eye and revealing a small boat tossed in its current. The painting captures the emotional storm that lives inside, composed on the surface, yet turbulent beneath. Nature becomes a mirror for the self: unpredictable, powerful, and deeply human.">
                <span class="art-frame"><img src="images/paintings/thumbs/tide_within.webp" alt="Tide Within" width="720" height="979" loading="eager" decoding="async"></span>
                <span class="art-title">Tide Within</span>
            </button>
            <button class="art" type="button" style="--ar: 0.643"
                    data-title="Bloom Within"
                    data-technique="Oil on Canvas, 20x30 cm"
                    data-full="images/paintings/large/bloom_within.webp"
                    data-description="This painting represents the nature within oneself. A faceless figure merges with nature, flowers bloom, and a butterfly spreads its wings across the forehead like a crown. This painting speaks to inner metamorphosis, where identity is not fixed, but ever-growing, ever-blending with the wild. Nature is not just around her; it is her.">
                <span class="art-frame"><img src="images/paintings/thumbs/bloom_within.webp" alt="Bloom Within" width="720" height="1120" loading="lazy" decoding="async"></span>
                <span class="art-title">Bloom Within</span>
            </button>
            <button class="art" type="button" style="--ar: 1.333"
                    data-title="Hope"
                    data-technique="Oil on Canvas, 50x60cm"
                    data-full="images/paintings/large/hope.webp"
                    data-description="This dead-calm river winds through forgotten ruins, the remains of a life long gone. The land, faded and colorless, breathes sorrow, a forest of agony. And yet, in the heart of despair, a moon rises, casting gentle light. Red vines still cling to the stones. In the middle of it all, a boat cuts across the stillness, someone has come. Searching. For life. For hope.">
                <span class="art-frame"><img src="images/paintings/thumbs/hope.webp" alt="Hope" width="960" height="720" loading="lazy" decoding="async"></span>
                <span class="art-title">Hope</span>
            </button>
            <button class="art" type="button" style="--ar: 0.492"
                    data-title="Sunflowers"
                    data-technique="Oil on canvas"
                    data-full="images/paintings/large/sunflowers.webp"
                    data-description="A gift for my older sister: sunflowers and butterflies painted across two stacked canvases. The top canvas, hers since she is the older one, stays at her place, while the lower one stays with me. Every edge is painted except where the two canvases meet, a reminder that each belongs to a set, a symbol of our sisterhood.">
                <span class="art-frame"><img src="images/paintings/thumbs/sunflowers.webp" alt="Sunflowers" width="720" height="1464" loading="lazy" decoding="async"></span>
                <span class="art-title">Sunflowers</span>
            </button>
        </div>
        </section>

        <section class="series">
            <header class="series-header">
                <h2>Life, death and in between</h2>
            </header>
        <div class="gallery">
            <button class="art" type="button" style="--ar: 0.806"
                    data-title="Fractured Beauty"
                    data-technique="Oil on canvas"
                    data-full="images/paintings/large/fractured_beauty.webp"
                    data-description="This painting is a tribute to embracing flaws and finding beauty in brokenness. The marble statue, cracked and incomplete, evokes both fragility and resilience. It stands as a visual metaphor to not hide the damage, but to honor it. In this piece, the cracks become the centerpiece, the subtle flower blooming from a fracture suggests that even in what is damaged, life still dares to grow. Rather than seeing the broken as ruined, this work reclaims damage as a source of value, life, and depth. It reminds us that imperfection is not a flaw to conceal, but a truth to embrace, a record of what was endured, and what still remains.">
                <span class="art-frame"><img src="images/paintings/thumbs/fractured_beauty.webp" alt="Fractured Beauty" width="720" height="893" loading="lazy" decoding="async"></span>
                <span class="art-title">Fractured Beauty</span>
            </button>
            <button class="art" type="button" style="--ar: 0.844"
                    data-title="Fading"
                    data-technique="Watercolor on paper"
                    data-full="images/paintings/large/fading.webp"
                    data-description="This painting captures a silhouette of a person sitting in the metro, slowly dissolving into their surroundings. The figure seems to fade into the bench, as if drained by the weight of exhaustion and emotional burnout. With dark, dripping strokes and a blurred outline, it reflects the quiet erasure of self that fatigue can bring, a moment where identity blends into the noise and movement of daily life. It&#x27;s a haunting image of being present physically, yet slowly disappearing mentally.">
                <span class="art-frame"><img src="images/paintings/thumbs/fading.webp" alt="Fading" width="720" height="853" loading="lazy" decoding="async"></span>
                <span class="art-title">Fading</span>
            </button>
            <button class="art" type="button" style="--ar: 0.796"
                    data-title="Contemplation"
                    data-technique="Oil on canvas"
                    data-full="images/paintings/large/contemplation.webp"
                    data-description="An old man cloaked in shadow sits in solitude, holding a skull in his hands. Through the cracked window behind him, a cemetery stretches into the distance beneath a turbulent sky. The graves, barely visible in the moonlight, echo the weight of his thoughts. The single melting candle on the windowsill is the only source of light, flickering against the overwhelming darkness. This painting speaks of death, memory, and reflection.">
                <span class="art-frame"><img src="images/paintings/thumbs/contemplation.webp" alt="Contemplation" width="720" height="904" loading="lazy" decoding="async"></span>
                <span class="art-title">Contemplation</span>
            </button>
            <button class="art" type="button" style="--ar: 0.832"
                    data-title="At Eternity’s Gate"
                    data-technique="Oil on Canvas 50x60 cm"
                    data-full="images/paintings/large/at_eternitys_gate.webp"
                    data-description="This painting reimagines Van Gogh facing his own legacy. Dressed in his iconic blue, he stands before a canvas showing an aged, grieving version of himself, a nod to his work &quot;At Eternity’s Gate.&quot; Behind him looms the stormy sky of &quot;Wheatfield with Crows.&quot; In his hand, a gun pointed downward doesn’t fire bullets, but sunflowers, symbolizing that Van Gogh’s true eternity lies not in his tragic end, but in the timeless beauty of his art.">
                <span class="art-frame"><img src="images/paintings/thumbs/at_eternitys_gate.webp" alt="At Eternity’s Gate" width="720" height="865" loading="lazy" decoding="async"></span>
                <span class="art-title">At Eternity’s Gate</span>
            </button>
            <button class="art" type="button" style="--ar: 0.750"
                    data-title="Skull of a skeleton with burning cigarette - Recreation"
                    data-technique="Oil on Canvas, 20x30 cm"
                    data-full="images/paintings/large/skull_of_a_skeleton_with_burning_cigarette_recreation.webp"
                    data-description="This piece is a recreation of Vincent van Gogh’s  painting “Skull of a skeleton with burning cigarette”.">
                <span class="art-frame"><img src="images/paintings/thumbs/skull_of_a_skeleton_with_burning_cigarette_recreation.webp" alt="Skull of a skeleton with burning cigarette - Recreation" width="720" height="960" loading="lazy" decoding="async"></span>
                <span class="art-title">Skull of a skeleton with burning cigarette - Recreation</span>
            </button>
            <button class="art" type="button" style="--ar: 0.827"
                    data-title="Cigarette"
                    data-technique="Watercolor on paper"
                    data-full="images/paintings/large/cigarette.webp"
                    data-description="A breath in, a cloud of smoke, and silence. Whitin a cigarette lies a fleeting escape, five minutes of stillness in a restless world. For a moment, stress fades, thoughts quiet down, and peace takes over. It’s not about the smoke, but the pause it carves out of life.">
                <span class="art-frame"><img src="images/paintings/thumbs/cigarette.webp" alt="Cigarette" width="720" height="871" loading="lazy" decoding="async"></span>
                <span class="art-title">Cigarette</span>
            </button>
            <button class="art" type="button" style="--ar: 0.750"
                    data-title="Skull With a Hat"
                    data-technique="Watercolor on paper"
                    data-full="images/paintings/large/skull_with_a_hat.webp"
                    data-description="This skull, crowned with a cowboy hat and wrapped in a worn bandana, captures a spirit who never truly dies.">
                <span class="art-frame"><img src="images/paintings/thumbs/skull_with_a_hat.webp" alt="Skull With a Hat" width="720" height="960" loading="lazy" decoding="async"></span>
                <span class="art-title">Skull With a Hat</span>
            </button>
            <button class="art" type="button" style="--ar: 1.518"
                    data-title="Angel"
                    data-technique="Oil on Canvas, 50x70 cm"
                    data-full="images/paintings/large/angel.webp"
                    data-description="A reinterpretation of Roberto Ferri’s Il Canto Della Vergine, this painting channels the same haunting stillness and surreal beauty. This painting speaks of lost purity, an angelic figure, collapsed under the weight of expectations. The sword, rooted in the chest, is not just pain, but pressure, from religion, from society, from the silent rules we’re taught to obey. The blue birds hover, not as saviors, but as witnesses to a quiet surrender. It is a portrait of innocence undone by the very systems meant to protect it.">
                <span class="art-frame"><img src="images/paintings/thumbs/angel.webp" alt="Angel" width="1093" height="720" loading="lazy" decoding="async"></span>
                <span class="art-title">Angel</span>
            </button>
            <button class="art" type="button" style="--ar: 1.333"
                    data-title="Alive"
                    data-technique="Oil on Paper, A4"
                    data-full="images/paintings/large/alive.webp"
                    data-description="Emerging from the depths, wrapped in waves and one another, two figures grasp for breath, for warmth, for life. Caught between drowning and desire, they hold on, not to land, but to each other.">
                <span class="art-frame"><img src="images/paintings/thumbs/alive.webp" alt="Alive" width="960" height="720" loading="lazy" decoding="async"></span>
                <span class="art-title">Alive</span>
            </button>
            <button class="art" type="button" style="--ar: 0.628"
                    data-title="Reflections"
                    data-technique="Watercolor on paper"
                    data-full="images/paintings/large/reflections.webp"
                    data-description="In the stillness of the moment, she turns inward. The mirror does not just reflect her form but her vulnerability, strength, and quiet beauty. This painting captures the gentle duality of being: the image we present and the soul we cradle in silence.">
                <span class="art-frame"><img src="images/paintings/thumbs/reflections.webp" alt="Reflections" width="720" height="1147" loading="lazy" decoding="async"></span>
                <span class="art-title">Reflections</span>
            </button>
